apiVersion: v1
kind: ServiceAccount
metadata:
  name: unicorn-book-app-sa
  namespace: unicorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicorn-book-app-deploy
  namespace: unicorn
  labels:
    app: book
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book
  template:
    metadata:
      labels:
        app: book
    spec:
      serviceAccountName: unicorn-book-app-sa
      terminationGracePeriodSeconds: 30
      nodeSelector:
        unicorn: app
      containers:
      - name: book
        image: 163389715563.dkr.ecr.ap-northeast-2.amazonaws.com/unicorn-concert-app:v1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: AWS_REGION
          value: ap-northeast-2
        - name: TABLE_NAME
          value: unicorn-concert-db
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        lifecycle:
          preStop:
            httpGet:
              path: /health
              port: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: unicorn-book-app-svc
  namespace: unicorn
spec:
  type: NodePort
  selector:
    app: book
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
