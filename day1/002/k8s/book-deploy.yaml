apiVersion: apps/v1
kind: Deployment
metadata:
  name: book
  namespace: wskorea26
  labels:
    app: book
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book
  template:
    metadata:
      labels:
        app: book
    spec:
      nodeSelector:
        node-type: app
      tolerations:
      - key: node-type
        operator: Equal
        value: app
        effect: NoSchedule
      containers:
      - name: book
        image: PLACEHOLDER.dkr.ecr.ap-northeast-2.amazonaws.com/wskorea26-book-repo:stable
        ports:
        - containerPort: 8080
        env:
        - name: AWS_REGION
          value: ap-northeast-2
        - name: TABLE_NAME
          value: wskorea26-data-table
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: book
  namespace: wskorea26
spec:
  selector:
    app: book
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
