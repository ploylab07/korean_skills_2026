# Supplemental helm values (image mirrors + addon-only scheduling)
# Secrets/admin user are set via terraform `set` / `set_sensitive`.

prometheusOperator:
  enabled: true
  tls:
    enabled: false
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  nodeSelector:
    node-type: addon
  image:
    registry: ghcr.io
    repository: prometheus-operator/prometheus-operator

prometheus:
  enabled: true
  prometheusSpec:
    nodeSelector:
      node-type: addon
    # Chart default is quay.io/prometheus/prometheus — public.ecr.aws/prometheus/* does not exist
    retention: 7d

alertmanager:
  enabled: false

grafana:
  nodeSelector:
    node-type: addon
  service:
    type: ClusterIP
    port: 3000
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      uid: prometheus

kube-state-metrics:
  nodeSelector:
    node-type: addon

prometheus-node-exporter:
  nodeSelector:
    node-type: addon
  # Do NOT tolerate app taints — monitoring stays on addon NG
  tolerations: []
