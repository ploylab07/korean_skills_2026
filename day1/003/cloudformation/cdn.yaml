AWSTemplateFormatVersion: '2010-09-09'
Description: wsc2026 day1/003 CDN (WAF + CloudFront) — deploy in us-east-1

Parameters:
  S3BucketName:
    Type: String
  S3BucketArn:
    Type: String
  S3BucketRegionalDomainName:
    Type: String
  AlbDnsName:
    Type: String
  LambdaFunctionUrlHost:
    Type: String
    Description: Hostname only from Lambda Function URL (no https:// or trailing /)

Resources:
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: wsc2026-waf
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: wsc2026-waf
        SampledRequestsEnabled: true
      Rules:
        - Name: AWSManagedRulesSQLiRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              Name: AWSManagedRulesSQLiRuleSet
              VendorName: AWS
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: wsc2026-waf-sqli
            SampledRequestsEnabled: true
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              Name: AWSManagedRulesCommonRuleSet
              VendorName: AWS
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: wsc2026-waf-xss
            SampledRequestsEnabled: true
        - Name: RateLimitRule
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 200
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: wsc2026-waf-rate
            SampledRequestsEnabled: true
      Tags:
        - Key: Name
          Value: wsc2026-waf
        - Key: Project
          Value: wsc2026

  StaticOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: wsc2026-static-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  BookingRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: wsc2026-booking-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: rewrite /booking to /v1/book
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/booking' || request.uri.indexOf('/booking/') === 0) {
            request.uri = request.uri.replace(/^\/booking/, '/v1/book');
          }
          return request;
        }

  CdnDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: wsc2026-cdn
        Enabled: true
        DefaultRootObject: static/index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_All
        WebACLId: !GetAtt WebAcl.Arn
        Origins:
          - Id: S3-static
            DomainName: !Ref S3BucketRegionalDomainName
            OriginAccessControlId: !GetAtt StaticOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: ALB-booking
            DomainName: !Ref AlbDnsName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginSSLProtocols:
                - TLSv1.2
          - Id: Lambda-book-get
            DomainName: !Ref LambdaFunctionUrlHost
            CustomOriginConfig:
              HTTPPort: 443
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3-static
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /booking*
            TargetOriginId: ALB-booking
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt BookingRewriteFunction.FunctionARN
          - PathPattern: /v1/book*
            TargetOriginId: Lambda-book-get
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Name
          Value: wsc2026-cdn
        - Key: Project
          Value: wsc2026

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3BucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${S3BucketArn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CdnDistribution}'

Outputs:
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
  CloudFrontDistributionId:
    Value: !Ref CdnDistribution
  CloudFrontDomainName:
    Value: !GetAtt CdnDistribution.DomainName
  OriginAccessControlId:
    Value: !GetAtt StaticOriginAccessControl.Id
