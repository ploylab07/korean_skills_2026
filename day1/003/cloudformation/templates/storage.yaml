AWSTemplateFormatVersion: '2010-09-09'
Description: wsc2026 day1/003 storage (KMS without root/kms:*, S3, ECR, DynamoDB)

Parameters:
  Bibun:
    Type: String
    Default: '003'
  BucketSuffix:
    Type: String
    Default: skil
    Description: 영문 4자리 (S3 버킷명 wsc2026-static-<suffix>-<bibun>-bucket)

