    Type: AWS::IAM::Role
    Properties:
      RoleName: wsc2026-kms-admin-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: kms-admin-inline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:CreateAlias
                  - kms:CreateGrant
                  - kms:DescribeKey
                  - kms:EnableKey
                  - kms:EnableKeyRotation
                  - kms:DisableKey
                  - kms:DisableKeyRotation
                  - kms:GetKeyPolicy
                  - kms:GetKeyRotationStatus
                  - kms:ListAliases
                  - kms:ListGrants
                  - kms:ListKeyPolicies
                  - kms:ListResourceTags
                  - kms:PutKeyPolicy
                  - kms:ScheduleKeyDeletion
                  - kms:CancelKeyDeletion
                  - kms:TagResource
                  - kms:UntagResource
                  - kms:UpdateAlias
                  - kms:UpdateKeyDescription
                  - kms:DeleteAlias
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncryptFrom
                  - kms:ReEncryptTo
                  - kms:GenerateDataKey
                  - kms:GenerateDataKeyWithoutPlaintext
                Resource: '*'

  KmsAdminInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Name: wsc2026-kms-admin-profile
      Roles:
        - !Ref KmsAdminRole

  BookPodRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wsc2026-book-pod-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession

  BookFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wsc2026-book-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

