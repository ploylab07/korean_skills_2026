            Effect: Allow
            Principal: '*'
            Action:
              - kms:CreateAlias
              - kms:CreateGrant
              - kms:DescribeKey
              - kms:EnableKey
              - kms:EnableKeyRotation
              - kms:DisableKey
              - kms:DisableKeyRotation
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListGrants
              - kms:ListKeyPolicies
              - kms:ListResourceTags
              - kms:PutKeyPolicy
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:TagResource
              - kms:UntagResource
              - kms:UpdateAlias
              - kms:UpdateKeyDescription
              - kms:DeleteAlias
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
            Resource: '*'
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
                aws:PrincipalAccount: !Ref AWS::AccountId
          - Sid: AllowAccountDecryptPlaintext
            Effect: Allow
            Principal: '*'
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:GenerateDataKey
              - kms:CreateGrant
            Resource: '*'
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId
          - Sid: AllowKmsAdminRole
            Effect: Allow
            Principal:
              AWS: !GetAtt KmsAdminRole.Arn
            Action:
              - kms:CreateAlias
              - kms:CreateGrant
              - kms:DescribeKey
              - kms:EnableKey
              - kms:EnableKeyRotation
              - kms:DisableKey
              - kms:DisableKeyRotation
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListGrants
              - kms:ListKeyPolicies
              - kms:ListResourceTags
              - kms:PutKeyPolicy
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:TagResource
              - kms:UntagResource
              - kms:UpdateAlias
              - kms:UpdateKeyDescription
              - kms:DeleteAlias
              - kms:Encrypt
