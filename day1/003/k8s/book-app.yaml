apiVersion: v1
kind: Namespace
metadata:
  name: wsc2026
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wsc2026-book-sa
  namespace: wsc2026
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: book-config
  namespace: wsc2026
data:
  AWS_REGION: ap-northeast-2
  TABLE_NAME: wsc2026-book-table
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wsc2026-book-pdb
  namespace: wsc2026
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: wsc2026-book
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wsc2026-book-deploy
  namespace: wsc2026
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wsc2026-book
  template:
    metadata:
      labels:
        app: wsc2026-book
    spec:
      serviceAccountName: wsc2026-book-sa
      nodeSelector:
        wsc2026/node: application
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: wsc2026-book
      containers:
        - name: book
          image: PLACEHOLDER_ECR_IMAGE
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: book-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wsc2026-book-svc
  namespace: wsc2026
spec:
  type: ClusterIP
  internalTrafficPolicy: PreferClose
  selector:
    app: wsc2026-book
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wsc2026-book-ingress
  namespace: wsc2026
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: wsc2026-app-alb
    alb.ingress.kubernetes.io/security-groups: PLACEHOLDER_ALB_SG
    alb.ingress.kubernetes.io/subnets: PLACEHOLDER_HUB_SUBNETS
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: "8080"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wsc2026-book-svc
                port:
                  number: 80
