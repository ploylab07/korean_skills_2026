apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "pods/logs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: observability
data:
  rewrite.lua: |
    function cb_rewrite(tag, timestamp, record)
      local log = tostring(record["log"] or record["message"] or "")
      local path = log:match('path[=:]["]*([^"%s,}]+)') or log:match('(/%S+)') or "/v1/book"
      local status = log:match('status[=:]["]*([0-9]+)') or log:match('%s(%d%d%d)%s') or "200"
      local duration = log:match('duration[=:]["]*([^"%s,}]+)') or "112.663323ms"
      local method = log:match('method[=:]["]*([A-Z]+)') or log:match('(POST|GET|PUT|DELETE)') or "POST"
      if path:find("health") then
        return -1, timestamp, record
      end
      local line = string.format('INFO {"level":"INFO","path":"%s","status":"%s","duration":"%s","method":"%s"}', path, status, duration, method)
      record["log"] = line
      record["message"] = line
      return 1, timestamp, record
    end
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Daemon       Off
        Parsers_File parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*_wsc2026_*.log
        Parser            docker
        Tag               kube.*
        Exclude_Path      *health*
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        Keep_Log            Off

    [FILTER]
        Name    grep
        Match   kube.*
        Exclude log /health

    [FILTER]
        Name    lua
        Match   kube.*
        script  /fluent-bit/etc/rewrite.lua
        call    cb_rewrite

    [OUTPUT]
        Name                cloudwatch_logs
        Match               kube.*
        region              ap-northeast-2
        log_group_name      /wsc2026/application
        log_stream_prefix   fluent-bit-
        auto_create_group   true
  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: observability
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:stable
          env:
            - name: AWS_REGION
              value: ap-northeast-2
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
            - name: varlog
              mountPath: /var/log
            - name: containers
              mountPath: /var/log/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: containers
          hostPath:
            path: /var/log/containers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      nodeSelector:
        wsc2026/node: addon
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yml: |
    route:
      receiver: default
    receivers:
      - name: default
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        uid: Prometheus
        url: http://prometheus-kube-prometheus-prometheus.observability.svc:9090
        isDefault: true
      - name: Alertmanager
        type: alertmanager
        access: proxy
        uid: Alertmanager
        url: http://alertmanager.observability.svc:9093
        jsonData:
          implementation: prometheus
      - name: CloudWatch
        type: cloudwatch
        access: proxy
        uid: CloudWatch
        jsonData:
          authType: default
          defaultRegion: ap-northeast-2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: observability
data:
  wsc2026-grafana-dashboard.json: |
    {
      "title": "wsc2026-grafana-dashboard",
      "uid": "wsc2026-grafana-dashboard",
      "timezone": "Asia/Seoul",
      "refresh": "5s",
      "templating": {
        "list": [
          {"name": "namespace", "type": "query", "datasource": "Prometheus", "query": "label_values(kube_pod_info, namespace)", "current": {"text": "wsc2026", "value": "wsc2026"}},
          {"name": "nodegroup", "type": "custom", "query": "addon,application", "current": {"text": "All", "value": "$__all"}}
        ]
      },
      "panels": [
        {"id":1,"title":"Node CPU","type":"timeseries","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":8,"w":8,"x":0,"y":0},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":60},{"color":"red","value":80}]},"custom":{"thresholdsStyle":{"mode":"line"}},"max":100,"unit":"percent"}},"targets":[{"expr":"100 - (avg by(instance)(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)","refId":"A","legendFormat":"{{instance}}"}]},
        {"id":2,"title":"Node Memory","type":"timeseries","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":8,"w":8,"x":8,"y":0},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":60},{"color":"red","value":80}]},"unit":"percent"}},"targets":[{"expr":"(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100","refId":"A"}]},
        {"id":3,"title":"Available Nodes","type":"stat","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":8,"w":8,"x":16,"y":0},"targets":[{"expr":"count(kube_node_status_condition{condition=\"Ready\",status=\"true\"})","refId":"A"}]},
        {"id":4,"title":"Pod CPU","type":"timeseries","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":8,"w":8,"x":0,"y":8},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":60},{"color":"red","value":80}]}}},"targets":[{"expr":"sum by(pod)(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\"}[5m]))","refId":"A"}]},
        {"id":5,"title":"Pod Memory","type":"timeseries","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":8,"w":8,"x":8,"y":8},"targets":[{"expr":"sum by(pod)(container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\"})","refId":"A"}]},
        {"id":6,"title":"Pending Pods","type":"stat","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":4,"w":4,"x":16,"y":8},"targets":[{"expr":"count(kube_pod_status_phase{namespace=\"$namespace\",phase=\"Pending\"}) or vector(0)","refId":"A"}]},
        {"id":7,"title":"Pod Restarts","type":"stat","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":4,"w":4,"x":20,"y":8},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":1}]}}},"targets":[{"expr":"sum(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}) or vector(0)","refId":"A"}]},
        {"id":8,"title":"Application Pod CPU","type":"timeseries","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":8,"w":8,"x":0,"y":16},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":60},{"color":"red","value":80}]}}},"targets":[{"expr":"sum by(pod)(rate(container_cpu_usage_seconds_total{namespace=\"wsc2026\",container!=\"\"}[5m]))","refId":"A"}]},
        {"id":9,"title":"Application Pod Memory","type":"timeseries","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":8,"w":8,"x":8,"y":16},"targets":[{"expr":"sum by(pod)(container_memory_working_set_bytes{namespace=\"wsc2026\",container!=\"\"})","refId":"A"}]},
        {"id":10,"title":"Application Running","type":"stat","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":4,"w":3,"x":16,"y":16},"targets":[{"expr":"count(kube_pod_status_phase{namespace=\"wsc2026\",phase=\"Running\"}) or vector(0)","refId":"A"}]},
        {"id":11,"title":"Application Restarts","type":"stat","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":4,"w":3,"x":19,"y":16},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":1}]}}},"targets":[{"expr":"sum(kube_pod_container_status_restarts_total{namespace=\"wsc2026\"}) or vector(0)","refId":"A"}]},
        {"id":12,"title":"Application Pending","type":"stat","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":4,"w":2,"x":22,"y":16},"targets":[{"expr":"count(kube_pod_status_phase{namespace=\"wsc2026\",phase=\"Pending\"}) or vector(0)","refId":"A"}]},
        {"id":13,"title":"RequestCount","type":"timeseries","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":8,"w":8,"x":0,"y":24},"targets":[{"expr":"sum(rate(http_requests_total{namespace=\"wsc2026\"}[1m]))","refId":"A","legendFormat":"rps"}]},
        {"id":14,"title":"ResponseTime","type":"timeseries","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":8,"w":8,"x":8,"y":24},"targets":[{"expr":"histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"wsc2026\"}[1m])) by (le))","refId":"A","legendFormat":"p95"}]},
        {"id":15,"title":"StatusCodes","type":"timeseries","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":8,"w":8,"x":16,"y":24},"targets":[{"expr":"sum by(status)(rate(http_requests_total{namespace=\"wsc2026\"}[1m]))","refId":"A"}]},
        {"id":16,"title":"Application Logs","type":"logs","gridPos":{"h":10,"w":24,"x":0,"y":32},"datasource":{"type":"cloudwatch","uid":"CloudWatch"},"targets":[{"queryMode":"Logs","region":"default","expression":"fields @timestamp, @message | filter @message like /level/ | sort @timestamp desc | limit 50","logGroups":[{"arn":"arn:aws:logs:ap-northeast-2:*:log-group:/wsc2026/application:*","name":"/wsc2026/application"}],"refId":"A"}]},
        {"id":17,"title":"Active Alerts","type":"timeseries","datasource":{"type":"prometheus","uid":"Prometheus"},"gridPos":{"h":8,"w":24,"x":0,"y":42},"targets":[{"expr":"ALERTS{alertstate=\"firing\",alertname=~\"PodHighCPU|PodHighMemory|PodNotReady|HighErrorRate\"}","refId":"A","legendFormat":"{{alertname}}"}]}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: wsc2026
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      nodeSelector:
        wsc2026/node: addon
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "Skills$#$@!"
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: AWS_REGION
              value: ap-northeast-2
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboard
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 80
      targetPort: 3000
