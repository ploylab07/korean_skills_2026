apiVersion: v1
kind: Namespace
metadata:
  name: skills
---
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: book
  namespace: skills
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book
  namespace: skills
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book
  template:
    metadata:
      labels:
        app: book
    spec:
      serviceAccountName: book
      nodeSelector:
        role: app
      containers:
        - name: book
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: AWS_REGION
              value: ap-northeast-2
            - name: TABLE_NAME
              value: books
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: book-svc
  namespace: skills
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
spec:
  selector:
    app: book
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
# Deny ingress to book from unlabeled pods (nginx-test). ALB→pod is node/ENI path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: book-allow-limited
  namespace: skills
spec:
  podSelector:
    matchLabels:
      app: book
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 8080
