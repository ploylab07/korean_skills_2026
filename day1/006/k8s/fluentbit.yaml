apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  /fluent-bit/etc/parsers.conf

    [INPUT]
        Name              tail
        Tag               book.raw
        Path              /var/log/containers/book-*.log
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        DB                /var/log/flb_book.db

    [FILTER]
        Name    grep
        Match   book.raw
        Exclude log /health
        Exclude message /health

    [FILTER]
        Name          parser
        Match         book.raw
        Key_Name      log
        Parser        book_access
        Reserve_Data  On

    [FILTER]
        Name          parser
        Match         book.raw
        Key_Name      message
        Parser        book_access
        Reserve_Data  On

    [OUTPUT]
        Name                cloudwatch_logs
        Match               book.raw
        region              ap-northeast-2
        log_group_name      /eks/book-svc/access
        log_stream_name     STREAM_PLACEHOLDER
        auto_create_group   On
  parsers.conf: |
    [PARSER]
        Name        book_access
        Format      regex
        Regex       ^.*access method=(?<method>\S+) path=(?<path>\S+) status=(?<status_code>\d+) .* remote_addr=(?<remote_addr>\S+).*
  # Stream names at runtime: /book-svc/ap-northeast-2a and /book-svc/ap-northeast-2b
  # (IMDS AZ → STREAM_PLACEHOLDER substitution in entrypoint.sh)
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail
    TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
    AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)
    STREAM="/book-svc/${AZ}"
    echo "AWS for Fluent Bit (custom) STREAM_NAME=${STREAM}"
    sed "s|STREAM_PLACEHOLDER|${STREAM}|g" /fluent-bit/etc/fluent-bit.conf > /tmp/fluent-bit.conf
    exec /fluent-bit/bin/fluent-bit \
      -e /fluent-bit/firehose.so \
      -e /fluent-bit/cloudwatch.so \
      -e /fluent-bit/kinesis.so \
      -c /tmp/fluent-bit.conf
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aws-for-fluent-bit
  namespace: logging
spec:
  selector:
    matchLabels:
      app: aws-for-fluent-bit
  template:
    metadata:
      labels:
        app: aws-for-fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: IMAGE_ECR/ecr-public/aws-observability/aws-for-fluent-bit:stable
          command: ["/bin/bash", "/fluent-bit/etc/entrypoint.sh"]
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: config
              mountPath: /fluent-bit/etc/
          env:
            - name: AWS_REGION
              value: ap-northeast-2
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: fluent-bit-config
            defaultMode: 0755
