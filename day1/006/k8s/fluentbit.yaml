apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               book.*
        Path              /var/log/containers/book-*.log
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        DB                /var/log/flb_book.db

    [FILTER]
        Name                kubernetes
        Match               book.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            On

    [FILTER]
        Name    grep
        Match   book.*
        Exclude log /health

    [FILTER]
        Name          parser
        Match         book.*
        Key_Name      log
        Parser        book_access
        Reserve_Data  Off

    [OUTPUT]
        Name                cloudwatch_logs
        Match               book.*
        region              ap-northeast-2
        log_group_name      /eks/book-svc/access
        log_stream_prefix   /book-svc/
        auto_create_group   On
        log_key             log
  parsers.conf: |
    [PARSER]
        Name        book_access
        Format      regex
        Regex       ^.*access method=(?<method>\S+) path=(?<path>\S+) status=(?<status_code>\d+) .* remote_addr=(?<remote_addr>\S+).*
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aws-for-fluent-bit
  namespace: logging
spec:
  selector:
    matchLabels:
      app: aws-for-fluent-bit
  template:
    metadata:
      labels:
        app: aws-for-fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: 163389715563.dkr.ecr.ap-northeast-2.amazonaws.com/ecr-public/aws-observability/aws-for-fluent-bit:stable
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: config
              mountPath: /fluent-bit/etc/
          env:
            - name: AWS_REGION
              value: ap-northeast-2
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: fluent-bit-config
