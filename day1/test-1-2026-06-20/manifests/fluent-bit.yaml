apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: ${namespace}
  annotations:
    eks.amazonaws.com/role-arn: ${role_arn}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ${name}
  namespace: ${namespace}
spec:
  selector:
    matchLabels:
      app: ${name}
  template:
    metadata:
      labels:
        app: ${name}
    spec:
      serviceAccountName: fluent-bit
      nodeSelector:
        role: ${app_node_label}
      tolerations:
        - key: app
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:2.32.2
          env:
            - name: AWS_REGION
              value: ap-northeast-2
            - name: LOG_GROUP_NAME
              value: ${log_group}
            - name: LOG_STREAM_NAME
              value: ${log_stream}
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: config
              mountPath: /fluent-bit/etc/
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: ${name}-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${name}-config
  namespace: ${namespace}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Daemon       Off
        Log_Level    info
        Parsers_File parsers.conf

    [INPUT]
        Name              tail
        Tag               app.${app_label}
        Path              /var/log/containers/*${app_label}*.log
        Parser            docker
        DB                /var/log/flb_${app_label}.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On

    [FILTER]
        Name    grep
        Match   app.${app_label}
        Regex   log (GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)

    [FILTER]
        Name    grep
        Match   app.${app_label}
        Exclude log /health

    [OUTPUT]
        Name                cloudwatch_logs
        Match               app.${app_label}
        region              ap-northeast-2
        log_group_name      ${log_group}
        log_stream_name     ${log_stream}
        auto_create_group   false
        log_key             log

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On
