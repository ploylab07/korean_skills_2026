apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: application
  namespace: app
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: ALB_NAME
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/security-groups: ALB_SECURITY_GROUP_ID
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    alb.ingress.kubernetes.io/healthcheck-path: /healthcheck
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/wafv2-acl-arn: WAF_ACL_ARN
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=ALB_LOG_BUCKET,access_logs.s3.prefix=alb,idle_timeout.timeout_seconds=60,deletion_protection.enabled=false
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30,load_balancing.algorithm.type=least_outstanding_requests
    alb.ingress.kubernetes.io/tags: Project=apdev,Environment=dev,ManagedBy=AWSLoadBalancerController
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /healthcheck
            pathType: Exact
            backend:
              service:
                name: user
                port:
                  number: 80
          - path: /v1/user
            pathType: Prefix
            backend:
              service:
                name: user
                port:
                  number: 80
          - path: /v1/product
            pathType: Prefix
            backend:
              service:
                name: product
                port:
                  number: 80
          - path: /v1/stress
            pathType: Prefix
            backend:
              service:
                name: stress
                port:
                  number: 80
